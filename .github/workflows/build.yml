name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          df -h
          XCODE_VERSION="27.1"
          for app in /Applications/Xcode_*.app; do
            base="$(basename "$app")"
            if [ "$base" != "Xcode_${XCODE_VERSION}.app" ] && [ "$base" != "Xcode_${XCODE_VERSION}.0.app" ]; then
              echo "Removing unused $app"
              sudo rm -rf "$app" || true
            fi
          done
          df -h

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          echo "REQUIRED_XCODE_VERSION=$XCODE_VERSION" >> "$GITHUB_ENV"
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
            echo "OVERRIDE_XCODE_FLAG=" >> "$GITHUB_ENV"
          else
            echo "Xcode_${XCODE_VERSION}.app not found; using default Xcode with --overrideXcodeVersion"
            echo "OVERRIDE_XCODE_FLAG=--overrideXcodeVersion" >> "$GITHUB_ENV"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -eux
          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios
          mv "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Build the App
        run: |
          set -eux
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset | tr -d '[:space:]')"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          BUILD_NUMBER="$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            $OVERRIDE_XCODE_FLAG \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts"

          ls -lh "$SOURCE_DIR/build/artifacts"

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          TAG_NAME="build-${BUILD_NUMBER}"
          gh release create "$TAG_NAME" \
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa \
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Telegram ${APP_VERSION} (${BUILD_NUMBER})" \
            --notes "Unsigned build of Telegram for iOS ${APP_VERSION} (${BUILD_NUMBER}) (account limit: 16 / 32)."
